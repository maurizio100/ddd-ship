networks:
  ship-network:
    driver: bridge

volumes:
  hexagonship-postgres-data-solo:
    name: hexagonship-postgres-data-solo
  minio-data:
    name: minio-data

services:
  hexagonship-frontend:
    container_name: hexagonship-frontend
    image: ddd-ship-frontend
    build:
      dockerfile: Dockerfile
      context: ship-frontend/.
    environment:
      BACKEND_URL: http://hexagonship-backend:8080
    networks:
      - ship-network
    ports:
      - "80:80"
    depends_on:
      - hexagonship-service
      - hexagonship-db

  hexagonship-service:
    container_name: hexagonship-backend
    image: ddd-ship-backend
    build:
      dockerfile: Dockerfile
      context: ship-backend/.
    environment:
      SPRING_PROFILES_ACTIVE: dev
      HARBOR_NAME: "Hexagon Harbor"
      # App only, no Kafka: keep Kafka listeners idle.
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
    networks:
      - ship-network
    ports:
      - "8080:8080"
    depends_on:
      - hexagonship-db

  hexagonship-db:
    container_name: hexagonship-db-postgres
    image: postgres:13.6
    networks:
      - ship-network
    environment:
      - "POSTGRES_DB=hexagonship"
      - "POSTGRES_USER=hexagonship_user"
      - "POSTGRES_PASSWORD=hexagonship_user"
    ports:
      - "5432:5432"
    volumes:
      - "hexagonship-postgres-data-solo:/var/lib/postgresql/data"
  minio:
    container_name: hexagonship-minio
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - ship-network
    volumes:
      - "minio-data:/bitnami/minio/data"
    environment:
      - MINIO_ROOT_USER=hexagonminio
      - MINIO_ROOT_PASSWORD=hexagonminio
      - MINIO_DEFAULT_BUCKETS=catains