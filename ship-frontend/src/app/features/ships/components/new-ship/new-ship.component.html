<div class="page">
  <header class="page-header">
    <p class="kicker">Commission a new vessel</p>
    <h1>Create New Ship</h1>
  </header>

  <form #shipform="ngForm" (ngSubmit)="createShip()">
    <mat-form-field appearance="outline" class="ship-name">
      <mat-label>Ship Name</mat-label>
      <input
        matInput
        name="ship_name"
        #ship_name="ngModel"
        required
        id="new-ship"
        data-testid="ship-name-input"
        [(ngModel)]="shipRequest.name"
        type="text"
      />
    </mat-form-field>

    <section class="catain-section">
      <h2>Choose Your Catain</h2>
      <div class="catain-grid" role="radiogroup" aria-label="Choose Your Catain">
        @for (catain of (catains$ | async); track catain.id) {
          <label
            class="catain"
            [class.catain--selected]="isSelected(catain.id)"
            data-testid="catain-card"
          >
            <input
              class="catain-radio"
              type="radio"
              name="catain"
              data-testid="catain-radio"
              [value]="catain.id"
              [(ngModel)]="shipRequest.catainId"
              required
            />
            <span class="ring">
              @if (!imageFailed(catain.id)) {
                <img
                  [src]="getImageUrl(catain.id)"
                  [alt]="catain.name"
                  (error)="onImageError(catain.id)"
                  data-testid="catain-image"
                />
              } @else {
                <mat-icon fontIcon="pets" data-testid="catain-image-fallback"></mat-icon>
              }
            </span>
            <span class="catain-name">{{ catain.name }}</span>
            @if (isSelected(catain.id)) {
              <span class="badge" data-testid="catain-selected-badge">
                <mat-icon fontIcon="check" aria-hidden="true"></mat-icon>
                Selected
              </span>
            }
          </label>
        }
      </div>
    </section>

    <div class="actions">
      <button mat-stroked-button type="button" data-testid="cancel" (click)="cancel()">Cancel</button>
      <button
        mat-flat-button
        type="submit"
        data-testid="create-ship"
        [disabled]="shipform.form.invalid"
      >
        Create Ship
      </button>
    </div>
  </form>
</div>
