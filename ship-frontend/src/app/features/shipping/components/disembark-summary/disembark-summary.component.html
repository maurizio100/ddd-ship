<div class="page">
  <header class="page-header">
    <p class="kicker">{{ shipping.name }} left the harbor</p>
    <h1>Shipping Summary</h1>
  </header>

  <div class="summary">
    <section class="panel ship" aria-labelledby="summary-ship-heading">
      <h2 id="summary-ship-heading">{{ shipping.name }}</h2>
      <img class="ship__catain" [src]="getImageUrl(shipping.catainId)" [alt]="shipping.catainName" />
      <p class="ship__line">Commanded by {{ shipping.catainName }}</p>
      @if (shipping.destinationHarbor) {
        <p class="ship__line" data-testid="shipping-summary-destination-harbor">
          Bound for {{ shipping.destinationHarbor }}
        </p>
      }
    </section>

    <section class="panel" aria-labelledby="summary-cargo-heading">
      <h2 id="summary-cargo-heading">Loaded Cargo</h2>
      <app-cargos [shipping]="shipping" [showLoaded]="true"></app-cargos>
    </section>
  </div>

  <p class="sailors-code">{{ shipping.sailorsCode }}</p>

  <div class="actions">
    <button mat-stroked-button type="button" (click)="allShips()">View all Ships</button>
  </div>
</div>
