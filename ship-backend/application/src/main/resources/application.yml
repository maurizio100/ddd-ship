spring:
  flyway:
    placeholders:
      # This Harbor's name, for migrations that backfill it (V17).
      harbor_name: ${harbor.name}
  datasource:
    url: jdbc:postgresql://hexagonship-db-postgres:5432/hexagonship
    username: hexagonship_user
    password: hexagonship_user
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: false
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      # The consumer group is derived from harbor.name (KafkaConsumerConfiguration).
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Set SPRING_KAFKA_LISTENER_AUTO_STARTUP=false where no Kafka runs, so listeners stay idle.
      auto-startup: true

harbor:
  # Required: every ship-backend is one Harbor. Set via HARBOR_NAME.
  name: ""

minio:
  url: http://minio:9000
  access:
    name: hexagonminio
    secret: hexagonminio
  bucket:
    name: catains

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
