openapi: 3.0.3
info:
  title: Ship Backend API
  version: 1.0.0

paths:
  /web/ships:
    get:
      summary: Get all ships
      operationId: getShips
      tags: [Ships]
      responses:
        '200':
          description: List of ships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShipOverviewResponse'
    post:
      summary: Create a ship
      operationId: createShip
      tags: [Ships]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipCreationRequest'
      responses:
        '200':
          description: Created ship
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipOverviewResponse'

  /web/ships/{shipId}:
    parameters:
      - name: shipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get ship details
      operationId: getShip
      tags: [Ships]
      responses:
        '200':
          description: Ship details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a ship
      operationId: updateShip
      tags: [Ships]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipUpdateRequest'
      responses:
        '200':
          description: Updated ship
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipOverviewResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a ship
      operationId: deleteShip
      tags: [Ships]
      responses:
        '204':
          description: Ship deleted

  /web/ships/{shipId}/cargos:
    parameters:
      - name: shipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Load cargo onto a ship
      operationId: loadCargo
      tags: [Ship Cargo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargoLoadRequest'
      responses:
        '200':
          description: Updated ship details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipDetailResponse'
        '400':
          description: cargoId is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Ship or cargo not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: >-
            The load is rejected and neither the ship nor the Stock changes: the ship would exceed its
            Max Weight (title "Ship too heavy"), the Cargo is already loaded (title "Cargo already loaded"),
            or the Harbor's Stock holds none of it (title "Cargo out of Stock"). `detail` names the Cargo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /web/ships/{shipId}/cargos/{cargoId}:
    parameters:
      - name: shipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cargoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Unload cargo from a ship
      operationId: unloadCargo
      tags: [Ship Cargo]
      responses:
        '200':
          description: Updated ship details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /web/ships/{shipId}/shippings/{shippingId}:
    parameters:
      - name: shipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: shippingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get shipping details
      operationId: getShippingDetails
      tags: [Shippings]
      responses:
        '200':
          description: Shipping details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /web/ships/{shipId}/shippings:
    parameters:
      - name: shipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Create a shipping for a ship
      operationId: createShipping
      tags: [Shippings]
      responses:
        '200':
          description: Created shipping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Release a shipping to a Destination Harbor
      description: >-
        Releases the ship's Shipping to the Destination Harbor, which must be one of this Harbor's Known
        Harbors (`GET /web/harbors`). The Shipping Published event names this Harbor as Origin Harbor.
      operationId: releaseShipping
      tags: [Shippings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseShippingRequest'
      responses:
        '200':
          description: Released shipping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingResponse'
        '400':
          description: destinationHarbor is missing or blank
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The Release is rejected and the ship is still being prepared: the Destination Harbor is not
            one of the Known Harbors (title "Unknown Destination Harbor", `detail` names the Harbor), or
            the ship is not being prepared, for instance because it is already at sea (title "Ship not
            being prepared", `detail` names the ship). Nothing is written and no Shipping Published event
            is added.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /web/cargos:
    get:
      summary: Get the Available Cargo of this Harbor
      description: The catalog Cargo this Harbor's Stock holds at least one of, each with its Stock.
      operationId: getCargos
      tags: [Cargos]
      responses:
        '200':
          description: The Available Cargo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableCargoResponse'

  /web/catains:
    get:
      summary: Get all captains
      operationId: getCatains
      tags: [Catains]
      responses:
        '200':
          description: List of captains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatainResponse'

  /web/catains/{catainId}/image:
    parameters:
      - name: catainId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get captain image
      operationId: getCatainImage
      tags: [Catains]
      responses:
        '200':
          description: Captain image binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /web/harbors:
    get:
      summary: Get this Harbor's Harbor Name and its Known Harbors
      operationId: getKnownHarbors
      tags: [Harbors]
      responses:
        '200':
          description: The current Harbor and the other Harbors it has learned of
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnownHarbors'

components:
  responses:
    NotFound:
      description: The ship, shipping or cargo was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ShipCreationRequest:
      type: object
      properties:
        name:
          type: string
        catainId:
          type: string
          format: uuid
          description: ID of the captain to assign

    ShipUpdateRequest:
      type: object
      properties:
        name:
          type: string

    CargoLoadRequest:
      type: object
      properties:
        cargoId:
          type: string
          format: uuid

    ReleaseShippingRequest:
      type: object
      required: [destinationHarbor]
      properties:
        destinationHarbor:
          type: string
          description: Harbor Name of the Destination Harbor, one of the Known Harbors

    ShipOverviewResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        catain:
          type: string
          description: Captain name
        shippingState:
          $ref: '#/components/schemas/ShippingState'

    ShipDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cargo:
          type: array
          items:
            $ref: '#/components/schemas/CargoResponse'
        weight:
          type: number
          format: float
          description: Current cargo weight
        maxweight:
          type: number
          format: float
          description: Maximum cargo capacity (15.0)

    CargoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        weight:
          type: number
          format: float

    AvailableCargoResponse:
      type: object
      required: [id, name, weight, stock]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        weight:
          type: number
          format: float
        stock:
          type: integer
          minimum: 1
          description: How many of this Cargo the Harbor's Stock holds

    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    CatainResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    KnownHarbors:
      type: object
      required: [harborName, knownHarbors]
      properties:
        harborName:
          type: string
          description: Harbor Name of the Harbor answering
        knownHarbors:
          type: array
          description: Harbor Names of the other Harbors it has learned of, ordered by name; never its own
          items:
            type: string

    ShippingResponse:
      type: object
      required: [shippingState]
      properties:
        id:
          type: string
          format: uuid
        shipId:
          type: string
          format: uuid
        catainId:
          type: string
          format: uuid
        catainName:
          type: string
        name:
          type: string
          description: Ship name
        cargo:
          type: array
          items:
            $ref: '#/components/schemas/CargoResponse'
        sailorsCode:
          type: string
          nullable: true
          description: Generated sailors code (only set when shipping is released)
        weight:
          type: number
          format: float
        shippingState:
          $ref: '#/components/schemas/ShippingState'
        destinationHarbor:
          type: string
          nullable: true
          description: Harbor Name of the Destination Harbor (only set when shipping is released)

    ShippingState:
      type: string
      enum: [IDLE, PREPARING, SHIPPING, DONE]
